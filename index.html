<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Login Screen Style */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111b21; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; }
        #login-screen h2 { color: #00a884; margin-bottom: 20px; }
        #pass-input { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #2a3942; color: white; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; }
        #login-btn { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #00a884; color: #111b21; font-size: 16px; font-weight: bold; cursor: pointer; }
        #login-btn:hover { background: #008f72; }
        #error-msg { color: #f15c6d; font-size: 14px; margin-top: 10px; display: none; }

        /* Main Chat Screen Style (Hidden by default) */
        #chat-screen { display: none; width: 100%; height: 100%; max-width: 500px; flex-direction: column; background: #0b141a; }
        header { background: #111b21; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222d34; }
        .avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #111b21; margin-right: 15px; }
        .user-info h3 { font-size: 16px; color: #e9edef; }
        .user-info p { font-size: 12px; color: #8696a0; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-opacity: 0.06; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; position: relative; line-height: 1.4; word-wrap: break-word; color: #e9edef; display: flex; flex-direction: column; }
        .message .time { font-size: 10px; color: #8696a0; align-self: flex-end; margin-top: 4px; }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        
        form { padding: 10px; background: #111b21; display: flex; gap: 10px; align-items: center; }
        input#m { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #2a3942; color: white; font-size: 15px; outline: none; }
        form button { background: #00a884; border: none; padding: 12px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        form button svg { fill: #111b21; width: 20px; height: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>🔒 Secret Chat</h2>
        <p style="color:#8696a0; margin-bottom:15px; font-size:14px;">Enter the secret password to enter the room</p>
        <input type="password" id="pass-input" placeholder="Enter Password...">
        <button id="login-btn" onclick="checkPassword()">Unlock Chat</button>
        <div id="error-msg"></div>
    </div>

    <div id="chat-screen">
        <header>
            <div class="avatar">🔒</div>
            <div class="user-info">
                <h3>Saurav's Room</h3>
                <p>End-to-end encrypted</p>
            </div>
        </header>
        <div id="messages"></div>
        <form id="chat-form" onsubmit="sendMessage(event)">
            <input id="m" autocomplete="off" placeholder="Type a message..." />
            <button type="submit">
                <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
            </button>
        </form>
    </div>

    <script>
        let socket;
        let myName = "";

        // Password Check Function
        async function checkPassword() {
            const password = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await response.json();

            if (data.success) {
                // Agar password sahi hai, toh naam pucho aur chat dikhao
                while(!myName.trim()) {
                    myName = prompt("Enter your Name for Chat:");
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                
                // Connect Socket IO
                initSocket();
            } else {
                errorMsg.innerText = data.message;
                errorMsg.style.display = 'block';
            }
        }

        function initSocket() {
            socket = io();

            // Purani chat history load karna (Memory Setup)
            socket.on('load history', (history) => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = ""; // Clear screen
                history.forEach(msg => {
                    appendMessage(msg);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            // Naya message aane par
            socket.on('chat message', (msg) => {
                appendMessage(msg);
                const messagesDiv = document.getElementById('messages');
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('m');
            if (input.value.trim() !== "") {
                socket.emit('chat message', { text: input.value, sender: myName });
                input.value = '';
            }
        }

        function appendMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const item = document.createElement('div');
            item.classList.add('message');
            
            if (msg.sender === myName) {
                item.classList.add('sent');
                item.innerHTML = `<span>${msg.text}</span><span class="time">${msg.time}</span>`;
            } else {
                item.classList.add('received');
                item.innerHTML = `<strong style="color:#00a884; font-size:12px; margin-bottom:2px;">${msg.sender}</strong><span>${msg.text}</span><span class="time">${msg.time}</span>`;
            }
            
            messagesDiv.appendChild(item);
        }
    </style>
</body>
</html>
